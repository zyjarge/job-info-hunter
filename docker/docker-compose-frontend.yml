version: '3.8'

services:
  frontend:
    build:
      context: ../projects/frontend
      dockerfile: Dockerfile
      target: dev
      args:
        - BUILDKIT_PROGRESS=plain
      cache_from:
        - frontend:latest
      labels:
        - "build.logs=true"
    image: frontend:latest
    container_name: job_hunter_frontend
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://api-gateway:8080
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
      - PATH=/app/node_modules/.bin:$PATH
    ports:
      - "3000:3000"
    volumes:
      # 开发时挂载源代码目录
      - ../projects/frontend:/app
      # 持久化 node_modules
      - frontend_node_modules:/app/node_modules
      # 持久化构建缓存
      - frontend_build_cache:/app/.next
    networks:
      - job_hunter_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    restart: unless-stopped
    command: ["sh", "-c", "npm install && npm run dev"]

volumes:
  frontend_node_modules:
    driver: local
  frontend_build_cache:
    driver: local

networks:
  job_hunter_net:
    external: true 