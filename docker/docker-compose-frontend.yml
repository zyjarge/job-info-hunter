version: '3.8'

services:
  frontend:
    build:
      context: ../projects/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api-gateway:8080
    networks:
      - job-hunter-network
    restart: unless-stopped

networks:
  job-hunter-network:
    external: true 